name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish (e.g. v1.9.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --tests -- -D warnings

      - name: Test
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure cross-compile target is installed
        # dtolnay/rust-toolchain ignores its `targets:` input when a
        # rust-toolchain.toml is present; install explicitly as a fallback.
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../siggy-${TAG}-${{ matrix.target }}.tar.gz siggy
          cd ../../..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/siggy.exe" -DestinationPath "siggy-${env:TAG}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: siggy-${{ matrix.target }}
          path: siggy-${{ env.TAG }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # On workflow_dispatch the tag does not exist yet; the action
          # creates it at the workflow's checkout commit (default branch HEAD).
          # On a tag push this matches the pushed tag (a no-op create).
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: siggy-*

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # publish-crate.sh works on a `git worktree` of HEAD, which needs real
      # history rather than the default depth-1 checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version and guard against a mis-tagged release
        id: version
        run: |
          version=$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version;" \
                 "refusing to publish a mislabelled crate"
            exit 1
          fi
          # crates.io publishes are permanent (yank only), so never try to
          # republish a version that is already up -- it makes re-running a
          # release workflow fail on an otherwise fine release.
          if curl -sSf -H "User-Agent: siggy-release (github.com/johnsideserf/siggy)" \
               "https://crates.io/api/v1/crates/siggy/$version" >/dev/null 2>&1; then
            echo "already-published=true" >>"$GITHUB_OUTPUT"
            echo "::notice::siggy $version is already on crates.io; skipping publish"
          else
            echo "already-published=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.already-published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Strips the native-backend git dependencies, which crates.io rejects;
        # the published artifact is signal-cli-backend only. See the script.
        run: scripts/publish-crate.sh --live

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/update-homebrew
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          tap-token: ${{ secrets.TAP_TOKEN }}
